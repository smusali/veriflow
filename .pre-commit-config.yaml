repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        args: [--strict]
        files: ^(src/|main\.py|tests/)
        additional_dependencies:
          - openai==3.57.0
          - python-dotenv==1.2.4
          - pytest==9.2.0
