[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "veriflow"
version = "0.1.0"
description = "Evaluate a transcript against a workflow graph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai==3.57.0",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
demo = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=8.3",
    "ruff>=0.17.6",
]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "main.py", "scripts", "tests", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["src", "demo"]

[tool.ruff.lint.per-file-ignores]
# common inserts the repo root on the path before the package is imported.
"scripts/*.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "main.py", "tests", "demo"]
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
