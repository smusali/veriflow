services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/cases')",
        ]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
  web:
    build:
      context: ./demo/web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
